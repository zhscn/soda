[package]
name = "soda"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
ignore = "0.4"
libc = "0.2"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
nucleo-matcher = "0.3"
onig = { version = "6.5", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
regex = "1"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_json = "1"
signal-hook = { version = "0.3", default-features = false }
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"
